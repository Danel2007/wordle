<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle jolasa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Wordle jolasa</h1>

  <!-- Formulario inicial -->
  <form id="formulario">
    <label for="intentos">Intentos</label>
    <select id="intentos">
      <option>3</option><option>4</option><option>5</option>
      <option selected>6</option>
      <option>7</option><option>8</option><option>9</option><option>10</option>
    </select>

    <label for="letras">nº de letras</label>
    <select id="letras">
      <option>4</option>
      <option selected>5</option>
      <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
    </select>

    <button type="submit" id="boton-jugar">Jugar</button>
  </form>

  <p id="mensaje"></p>

  <!-- tablero y teclado virtual -->
  <section id="juego" class="oculto">
    <div id="tablero"></div>
    <div id="teclado"></div>
  </section>

  <!-- historial de las ultimas 10 partidas -->
  <section id="final" class="oculto">
    <h2>Últimas partidas</h2>
    <ul id="historial"></ul>
    <button id="boton-reiniciar">Jugar de nuevo</button>
  </section>

  <script src="javawordle.js"></script>
</body>
</html>
